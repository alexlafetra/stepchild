<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Stepchild — Headless</title>
    <style>
        :root{
            --bg: blue;
            --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            --ui-scale:2.0;
            --pixel-grid-visibility:hidden;
            --encoder-rotation-A:0deg;
            --encoder-rotation-B:0deg;
            --joystick-offset-x:0px;
            --joystick-offset-y:0px;
            --render-scale:0.8;
            --ui-visibility:visible;
        }
        @font-face {
            font-family: 'sf-compact-rounded-regular';
            src: url(../assets/SF-Compact-Rounded-Regular.ttf);
        }
        @font-face {
            font-family: 'sf-compact-rounded-bold';
            src: url(../assets/SF-Compact-Rounded-Bold.ttf);
        }
        @font-face {
            font-family: 'chopin';
            src: url(../assets/chopin.ttf);
        }
        html{
            background:var(--bg);
            /* font-family:var(--mono); */
            font-family:'sf-compact-rounded-regular';
            font-size:16px;
            color:white;
            display:flex;
            flex-direction:column;
            margin:0px;
            padding:0px;
        }
        body{
            margin:0px;
            padding:0px;
            width:100%;
            height:100vh;
        }
        #app_container{
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:auto;
            position:relative;
            background:var(--bg);
            width:100%;
            height:100%;
        }
        #canvas_container{
            display:flex;
            position:relative;
            justify-content: center;
        }
        canvas {
            image-rendering: pixelated;
            width:calc(var(--ui-scale) * 128px);
            height:calc(var(--ui-scale) * 64px);
            border:10px solid black;
        }
        .hardware_overlay{
            position:absolute;
            user-select: none;
            pointer-events: none;
        }
        #hardware_overlay_image{
            align-self: center;
            justify-self: center;
            width:calc(var(--ui-scale) * var(--render-scale) * 370px);
        }
        #title_image{
            width:200px;
        }
        #button_container{
            position:absolute;
            align-self: center;
            justify-self: center;
            width:fit-content;
        }
        #encoder_A_image{
            border-radius:calc(var(--ui-scale) * var(--render-scale) * 25px);
            height:calc(var(--ui-scale) * var(--render-scale) * 50px);
            width:calc(var(--ui-scale) * var(--render-scale) * 50px);
            left:calc(var(--ui-scale) * 109px * var(--render-scale));
            top:calc(var(--ui-scale) * -63px * var(--render-scale));
            transform: rotate(var(--encoder-rotation-A));
            transform-origin: center;
            /* transition:0.1s; */
        }
        #encoder_B_image{
            border-radius:calc(var(--ui-scale) * var(--render-scale) * 25px);
            height:calc(var(--ui-scale) * var(--render-scale) * 50px);
            width:calc(var(--ui-scale) * var(--render-scale) * 50px);
            left:calc(var(--ui-scale) * 109px * var(--render-scale));
            top:calc(var(--ui-scale) * 16px * var(--render-scale));
            transform: rotate(var(--encoder-rotation-B));
            transform-origin: center;
            /* transition:0.1s; */
        }
        #joystick_image{
            border-radius:calc(var(--ui-scale) * var(--render-scale) * 15px);
            height:calc(var(--ui-scale) * var(--render-scale) * 30px);
            width:calc(var(--ui-scale) * var(--render-scale) * 30px);
            left:calc(var(--ui-scale) * 79px * var(--render-scale) + var(--joystick-offset-x));
            top:calc(var(--ui-scale) * 101px * var(--render-scale) + var(--joystick-offset-y));
            /* transition:0.1s; */
        }
        #ui_container{
            position:absolute;
            left:0px;
            top:0px;
            padding:20px;
            display:flex;
            flex-direction: column;
            align-items: center;
            gap:10px;
        }
        .button{
            font-family: 'sf-compact-rounded-bold';
            font-size:16px;
            width:fit-content;
            padding:10px;
            border-radius: 2ch;
            cursor:pointer;
            color:var(--bg);
            background:white;
            transition:0.1s;
        }
        .button:hover{
            background:var(--bg);
            color:white;
        }
        .slider_container{
            display:flex;
            flex-direction: row;
        }
        .hardware_button{
            position:absolute;
            user-select: none;
            cursor:pointer;
            width:calc(var(--ui-scale) * var(--render-scale) * 15px);
            height:calc(var(--ui-scale) * var(--render-scale) * 15px);
            outline:0px solid;
            border-radius:calc(var(--ui-scale) * var(--render-scale) * 15px * 0.5);
        }
        .hardware_button:hover{
            outline-width: 2px;
        }
        #NEW_button{
            left:calc(var(--ui-scale) * -161.5px * var(--render-scale));
            top:calc(var(--ui-scale) * 32px * var(--render-scale));
            background:#6CAD54;
        }
        #SHIFT_button{
            left:calc(var(--ui-scale) * -161.5px * var(--render-scale));
            top:calc(var(--ui-scale) * 56.75px * var(--render-scale));
            background:#C5C7C1;
        }
        #SELECT_button{
            left:calc(var(--ui-scale) * -161.5px * var(--render-scale));
            top:calc(var(--ui-scale) * 81.5px * var(--render-scale));
            background:#C8B673;
        }
        #DELETE_button{
            left:calc(var(--ui-scale) * -161.5px * var(--render-scale));
            top:calc(var(--ui-scale) * 106.25px * var(--render-scale));
            background:#CD554E;
        }
        #LOOP_button{
            left:calc(var(--ui-scale) * -135.5px * var(--render-scale));
            top:calc(var(--ui-scale) * 132.5px * var(--render-scale));
            background:#3360C2;
        }
        #PLAY_button{
            left:calc(var(--ui-scale) * -110.75px * var(--render-scale));
            top:calc(var(--ui-scale) * 132.5px * var(--render-scale));
            background:#C5C7C1;
        }
        #COPY_button{
            left:calc(var(--ui-scale) * -86px * var(--render-scale));
            top:calc(var(--ui-scale) * 132.5px * var(--render-scale));
            background:#A7A4A0;
        }
        #MENU_button{
            left:calc(var(--ui-scale) * -61.25px * var(--render-scale));
            top:calc(var(--ui-scale) * 132.5px * var(--render-scale));
            background:#060602;
        }
        #button_tooltip_overlay{
            position:absolute;
            visibility: var(--ui-visibility);
            width:calc(var(--ui-scale) * var(--render-scale) * 500px);
            height:auto;
            left:calc(var(--ui-scale) * -255px * var(--render-scale));
            top:calc(var(--ui-scale) * -130px * var(--render-scale));
        }
        #headless_title{
            position:absolute;
            right:20px;
            top:-40px;
            font-family:'chopin';
            color:white;
            transform:scaleY(0.35);
            font-size:120px;
        }
    </style>
    <script src="../coi-serviceworker.min.js" type = "text/javascript"></script>
</head>
<body>
    <div id = "app_container">
        <div id = "canvas_container">
            <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
            <img id = "hardware_overlay_image" class = "hardware_overlay" src = "../assets/hardware_overlay_transparent.png">
            <div id = "button_container">
                <img id = "button_tooltip_overlay" src = "../assets/button_tooltip.svg">
                <img id = "encoder_A_image" class = "hardware_button" src = "../assets/encoder.png">
                <img id = "encoder_B_image" class = "hardware_button" src = "../assets/encoder.png">
                <img id = "joystick_image" class = "hardware_button" src = "../assets/joystick.png">
                <div id = "NEW_button" class = "hardware_button"></div>
                <div id = "SHIFT_button" class = "hardware_button"></div>
                <div id = "SELECT_button" class = "hardware_button"></div>
                <div id = "DELETE_button" class = "hardware_button"></div>
                <div id = "LOOP_button" class = "hardware_button"></div>
                <div id = "PLAY_button" class = "hardware_button"></div>
                <div id = "COPY_button" class = "hardware_button"></div>
                <div id = "MENU_button" class = "hardware_button"></div>
            </div>
        </div>
        <div id = "headless_title" class = "cursive_text">Headless</div>
        <div id = "ui_container">
            <div id = "title" style = "flex-direction:row;display:flex;">
                <img id = "title_image" src = "../assets/title.svg">
            </div>
            <div style = "display:flex;flex-direction: row;">
                <div>UI overlay:</div>
                <input type = "checkbox" id = "ui_overlay_checkbox" checked = "true">
            </div>
            <div class = "button" id = "init_midi_button">connect MIDI</div>
            <div class = "slider_container">
                <div class = "slider_label">zoom</div>
                <input id = "zoom_slider" type = "range" min = "1" max = "8" step = "0.1" value = "3">
            </div>
        </div>
    </div>
    <div id="status">Loading...</div>
    <script>
        let rotationA = 0, rotationB = 0;
        var midiInput = null;
        var midiOutput = null;
        var Module = {
            canvas: document.getElementById('canvas'),
            setStatus: function(text) {
                document.getElementById('status').innerText = text;
            },
            print: function(text) {
                console.log(text);
            }
        };
        function initMIDI(){
            navigator.requestMIDIAccess().then(function(midiAccess) {
                for (let output of midiAccess.outputs.values()) {
                    midiOutput = output;
                    console.log(midiOutput);
                    break; // grabbing the first available output, same as input
                }
                for (let input of midiAccess.inputs.values()) {
                    midiInput = input;
                    input.onmidimessage = function(event) {
                        // event.data is a Uint8Array: [status, data1, data2]
                        Module.ccall(
                            'onMidiMessage',
                            null,
                            ['number', 'number', 'number'],
                            [event.data[0], event.data[1] || 0, event.data[2] || 0]
                        );
                    };
                    break; // just grabbing the first available input for now
                }
                // document.documentElement.style.setProperty("--midi-connected", parseFloat(event.target.value));
                document.getElementById('init_midi_button').innerText = "MIDI connected";
            }).catch(function(err) {
                console.warn('Web MIDI access denied or unavailable:', err);
            });
        }
        initMIDI();
        // initialize midi button
        document.getElementById("init_midi_button").addEventListener('click',(event)=>{
            initMIDI();
        })
        // zoom slider
        document.getElementById("zoom_slider").addEventListener('input',(event)=>{
            document.documentElement.style.setProperty("--ui-scale", parseFloat(event.target.value));
        })
        // ui checkbox
        document.getElementById("ui_overlay_checkbox").addEventListener('change',(event)=>{
            document.documentElement.style.setProperty("--ui-visibility", event.target.checked?'visible':'hidden');
        })
        const preventDefaultKeys = new Set([
            'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
            ' ',        // spacebar
            'Tab'
        ]);
        window.addEventListener('keydown', function(e) {
            if (preventDefaultKeys.has(e.key)) {
                e.preventDefault();
            }
            switch(e.key){
                // joystick
                case 'ArrowUp':
                    document.documentElement.style.setProperty("--joystick-offset-y", "-20px");
                    break;
                case 'ArrowDown':
                    document.documentElement.style.setProperty("--joystick-offset-y", "20px");
                    break;
                case 'ArrowLeft':
                    document.documentElement.style.setProperty("--joystick-offset-x", "-20px");
                    break;
                case 'ArrowRight':
                    document.documentElement.style.setProperty("--joystick-offset-x", "20px");
                    break;
                // encoders
                case '0':
                    rotationA -= 360/16;
                    document.documentElement.style.setProperty("--encoder-rotation-A", `${rotationA}deg`);
                    break;
                case 'k':
                    rotationA += 360/16;
                    document.documentElement.style.setProperty("--encoder-rotation-A", `${rotationA}deg`)
                    break;
                case '-':
                    rotationB -= 360/16;
                    document.documentElement.style.setProperty("--encoder-rotation-B", `${rotationB}deg`);
                    break;
                case 'l':
                    rotationB += 360/16;
                    document.documentElement.style.setProperty("--encoder-rotation-B", `${rotationB}deg`)
                    break;
                
            }
  
        }, false);

        window.addEventListener('keyup', function(e) {
            if (preventDefaultKeys.has(e.key)) {
                e.preventDefault();
            }
            if(e.key == 'ArrowLeft' || e.key == 'ArrowRight')
                document.documentElement.style.setProperty("--joystick-offset-x", "0px");
            else if(e.key == 'ArrowUp' || e.key == 'ArrowDown')
                document.documentElement.style.setProperty("--joystick-offset-y", "0px");
        }, false);
    </script>

    <!-- Emscripten injects the generated JS loader here -->
    <script async type="text/javascript" src="headless.js"></script>
</body>
</html>
