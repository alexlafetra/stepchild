name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # lets you manually trigger a redeploy from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.5

      - name: Configure
        working-directory: code/stepchild/headless
        run: |
          mkdir -p build-wasm
          cd build-wasm
          emcmake cmake ..

      - name: Build
        working-directory: code/stepchild/headless/build-wasm
        run: emmake make

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy
          cp code/stepchild/headless/build-wasm/headless.html deploy/index.html
          cp code/stepchild/headless/build-wasm/headless.js deploy/
          cp code/stepchild/headless/build-wasm/headless.wasm deploy/
          cp code/stepchild/headless/coi-serviceworker.js deploy/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy