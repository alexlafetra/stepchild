<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Stepchild — Headless</title>
    <style>
        :root{
            --bg: blue;
            --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            --ui-scale:2.0;
            --pixel-grid-visibility:hidden;
            --encoder-rotation-A:0deg;
            --encoder-rotation-B:0deg;
            --joystick-offset-x:0px;
            --joystick-offset-y:0px;
            --render-scale:0.8;
            --ui-visibility:visible;
        }
        @media all and (max-width: 650px) {
            :root{
                --ui-scale:2.3;
                --pixel-grid-visibility:hidden;
                --encoder-rotation-A:0deg;
                --encoder-rotation-B:0deg;
                --joystick-offset-x:0px;
                --joystick-offset-y:0px;
                --render-scale:0.8;
                --ui-visibility:visible;
                --bg: red;
                --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            }
        }
        @font-face {
            font-family: 'sf-compact-rounded-regular';
            src: url(../assets/SF-Compact-Rounded-Regular.ttf);
        }
        @font-face {
            font-family: 'sf-compact-rounded-bold';
            src: url(../assets/SF-Compact-Rounded-Bold.ttf);
        }
        @font-face {
            font-family: 'chopin';
            src: url(../assets/chopin.ttf);
        }
        html{
            background:var(--bg);
            /* font-family:var(--mono); */
            font-family:'sf-compact-rounded-regular';
            font-size:16px;
            color:white;
            display:flex;
            flex-direction:column;
            margin:0px;
            padding:0px;
        }
        body{
            margin:0px;
            padding:0px;
            width:100%;
            height:100vh;
        }
        #app_container{
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:auto;
            position:relative;
            background:var(--bg);
            width:100%;
            height:100%;
        }
        #canvas_container{
            display:flex;
            position:relative;
            justify-content: center;
        }
        canvas {
            image-rendering: pixelated;
            width:calc(var(--ui-scale) * 128px);
            height:calc(var(--ui-scale) * 64px);
            border:10px solid black;
        }
        .hardware_overlay{
            position:absolute;
            user-select: none;
            pointer-events: none;
        }
        #hardware_overlay_image{
            align-self: center;
            justify-self: center;
            width:calc(var(--ui-scale) * var(--render-scale) * 370px);
        }
        #title_image{
            width:200px;
        }
        #button_container{
            position:absolute;
            align-self: center;
            justify-self: center;
            width:fit-content;
        }
        #encoder_A_image{
            border-radius:calc(var(--ui-scale) * var(--render-scale) * 25px);
            height:calc(var(--ui-scale) * var(--render-scale) * 50px);
            width:calc(var(--ui-scale) * var(--render-scale) * 50px);
            left:calc(var(--ui-scale) * 109px * var(--render-scale));
            top:calc(var(--ui-scale) * -63px * var(--render-scale));
            transform: rotate(var(--encoder-rotation-A));
            transform-origin: center;
            /* transition:0.1s; */
        }
        #encoder_B_image{
            border-radius:calc(var(--ui-scale) * var(--render-scale) * 25px);
            height:calc(var(--ui-scale) * var(--render-scale) * 50px);
            width:calc(var(--ui-scale) * var(--render-scale) * 50px);
            left:calc(var(--ui-scale) * 109px * var(--render-scale));
            top:calc(var(--ui-scale) * 16px * var(--render-scale));
            transform: rotate(var(--encoder-rotation-B));
            transform-origin: center;
            /* transition:0.1s; */
        }
        #joystick_image img{
            position:absolute;
            left:0px;
            top:0px;
        }
        #joystick_image{
            border-radius:calc(var(--ui-scale) * var(--render-scale) * 15px);
            height:calc(var(--ui-scale) * var(--render-scale) * 30px);
            width:calc(var(--ui-scale) * var(--render-scale) * 30px);
            left:calc(var(--ui-scale) * 79px * var(--render-scale) + var(--joystick-offset-x));
            top:calc(var(--ui-scale) * 101px * var(--render-scale) + var(--joystick-offset-y));
            /* transition:0.1s; */
        }
        #ui_container{
            position:absolute;
            left:0px;
            top:0px;
            padding:20px;
            display:flex;
            flex-direction: column;
            /* align-items: center; */
            gap:10px;
        }
        .button{
            font-family: 'sf-compact-rounded-bold';
            font-size:16px;
            width:fit-content;
            padding:10px;
            border-radius: 2ch;
            cursor:pointer;
            color:var(--bg);
            background:white;
            transition:0.1s;
        }
        .button:hover{
            background:var(--bg);
            color:white;
        }
        .slider_container{
            display:flex;
            flex-direction: row;
        }
        .hardware_button{
            position:absolute;
            user-select: none;
            cursor:pointer;
            width:calc(var(--ui-scale) * var(--render-scale) * 15px);
            height:calc(var(--ui-scale) * var(--render-scale) * 15px);
            outline:0px solid;
            border-radius:calc(var(--ui-scale) * var(--render-scale) * 15px * 0.5);
        }
        .hardware_button:hover{
            outline-width: 2px;
        }
        #NEW_button{
            left:calc(var(--ui-scale) * -161.5px * var(--render-scale));
            top:calc(var(--ui-scale) * 32px * var(--render-scale));
            background:#6CAD54;
        }
        #SHIFT_button{
            left:calc(var(--ui-scale) * -161.5px * var(--render-scale));
            top:calc(var(--ui-scale) * 56.75px * var(--render-scale));
            background:#C5C7C1;
        }
        #SELECT_button{
            left:calc(var(--ui-scale) * -161.5px * var(--render-scale));
            top:calc(var(--ui-scale) * 81.5px * var(--render-scale));
            background:#C8B673;
        }
        #DELETE_button{
            left:calc(var(--ui-scale) * -161.5px * var(--render-scale));
            top:calc(var(--ui-scale) * 106.25px * var(--render-scale));
            background:#CE564F;
        }
        #LOOP_button{
            left:calc(var(--ui-scale) * -135.5px * var(--render-scale));
            top:calc(var(--ui-scale) * 132.5px * var(--render-scale));
            background:#3360C2;
        }
        #PLAY_button{
            left:calc(var(--ui-scale) * -110.75px * var(--render-scale));
            top:calc(var(--ui-scale) * 132.5px * var(--render-scale));
            background:#C5C7C1;
        }
        #COPY_button{
            left:calc(var(--ui-scale) * -86px * var(--render-scale));
            top:calc(var(--ui-scale) * 132.5px * var(--render-scale));
            background:#A7A4A0;
        }
        #MENU_button{
            left:calc(var(--ui-scale) * -61.25px * var(--render-scale));
            top:calc(var(--ui-scale) * 132.5px * var(--render-scale));
            background:#060602;
        }
        #headless_title{
            position:absolute;
            right:20px;
            top:-40px;
            font-family:'chopin';
            color:white;
            transform:scaleY(0.35);
            font-size:120px;
        }
        #encoder_A_buttons{
            position:absolute;
            height:calc(var(--ui-scale) * var(--render-scale) * 50px);
            width:calc(var(--ui-scale) * var(--render-scale) * 50px);
            left:calc(var(--ui-scale) * 109px * var(--render-scale));
            top:calc(var(--ui-scale) * -63px * var(--render-scale));
        }
        #encoder_A_buttons:hover .encoder_button{
            visibility: visible;
        }
        #encoder_B_buttons{
            position:absolute;
            height:calc(var(--ui-scale) * var(--render-scale) * 50px);
            width:calc(var(--ui-scale) * var(--render-scale) * 50px);
            left:calc(var(--ui-scale) * 109px * var(--render-scale));
            top:calc(var(--ui-scale) * 16px * var(--render-scale));
        }
        #encoder_B_buttons:hover .encoder_button{
            visibility: visible;
        }
        .encoder_button{
            width:calc(15px * var(--ui-scale));;
            height:calc(15px * var(--ui-scale));
            font-size:calc(14px * var(--ui-scale));
            background:black;
            outline:solid white;
            outline-width:calc(1px * var(--ui-scale));
            color:white;
            border-radius:calc(7.5px * var(--ui-scale));
            position:absolute;
            text-align: center;
            display:flex;
            align-items: center;
            justify-content: center;
            cursor:pointer;
            /* visibility:hidden; */
            user-select: none;
            right:calc(-5px * var(--ui-scale));
            font-family:'sf-compact-rounded-bold';
        }
        .encoder_button:hover{
            background:white;
            color:black;
        }
        .up_button{
            top:calc(-5px * var(--ui-scale));
        }
        .down_button{
            bottom:calc(-5px * var(--ui-scale));
        }
        #joystick_buttons{
            position:absolute;
            height:100%;
            width:100%;
            /* height:calc(var(--ui-scale) * var(--render-scale) * 30px);
            width:calc(var(--ui-scale) * var(--render-scale) * 30px);
            left:calc(var(--ui-scale) * 79px * var(--render-scale) + var(--joystick-offset-x));
            top:calc(var(--ui-scale) * 101px * var(--render-scale) + var(--joystick-offset-y)); */
        }
        .joystick_button{
            width:calc(15px * var(--ui-scale));
            height:calc(15px * var(--ui-scale));
            background:black;
            outline:2px solid white;
            color:white;
            border-radius:calc(7.5px * var(--ui-scale));;
            position:absolute;
            text-align: center;
            cursor:pointer;
            visibility:hidden;
            user-select: none;
        }
        #joystick_image:hover .joystick_button{
            visibility: visible;
        }
        #joystick_buttons:hover .joystick_button{
            visibility: visible;
        }
        .joystick_button:hover{
            color:black;
            background:white;
        }
        #J_up{
            top:calc(-5px * var(--ui-scale));
            left:calc(50% - 7.5px * var(--ui-scale));
        }
        #J_down{
            bottom:calc(-5px * var(--ui-scale));
            left:calc(50% - 7.5px * var(--ui-scale));
        }
        #J_left{
            bottom:calc(50% - 7.5px * var(--ui-scale));
            left:calc(-5px * var(--ui-scale));
        }
        #J_right{
            bottom:calc(50% - 7.5px * var(--ui-scale));
            right:calc(-5px * var(--ui-scale));
        }
        .ui_text{
            font-family: monospace;
            white-space: pre;
        }
        .button_tooltip{
            user-select: none;
            font-size:calc(15px * var(--ui-scale));
            position:absolute;
            display:flex;
            width:fit-content;
            height:fit-content;
            font-family:'sf-compact-rounded-bold';
            align-items: center;
            gap:calc(5px * var(--ui-scale));
            position:absolute;
            flex-direction: row;
            visibility: var(--ui-visibility);
        }
        .tooltip_label{
            user-select: none;
        }
        .left{
            right:calc(100% + 10px * var(--ui-scale));
            top:calc(50% - 9px * var(--ui-scale));
            /* float:right; */
        }
        .bottom{
            top:calc(100% + 10px * var(--ui-scale));
            right:calc(50% - 9px * var(--ui-scale));
            flex-direction: column-reverse;
        }
        .joystick_keys{
            display:grid;
            width:fit-content;
            height: fit-content;
            grid-template-columns: auto auto auto;
            grid-template-rows:auto auto;
            grid-template-areas: 
            "none UP none2"
            "LEFT DOWN RIGHT";
            top: calc(220% - var(--joystick-offset-y));
            right: calc(-80% + var(--joystick-offset-x));
            gap:calc(2.5px * var(--ui-scale));
            justify-self: center;

        }
        .joystick_up{
            grid-area: UP;
            transform:rotatez(180deg);
        }
        .joystick_left{
            grid-area: LEFT;
        }
        .joystick_down{
            grid-area: DOWN;
        }
        .joystick_right{
            grid-area: RIGHT;
        }
        .encoder{
            display:grid;
            width:calc(20px * var(--ui-scale));
            height: fit-content;
            grid-template-columns: auto auto auto;
            grid-template-rows:auto auto auto;
            grid-template-areas: 
            "none1 UP UP"
            "PRESS PRESS LABEL"
            "none3 DOWN DOWN";
            left:calc(100% + 10px * var(--ui-scale));
            top: -33.33%;
            gap:calc(2.5px * var(--ui-scale));
            /* align-self: center; */

        }
        .encoder .tooltip_label{
            grid-area: LABEL;
        }
        .encoder_up{
            grid-area:UP;
        }
        .encoder_press{
            grid-area:PRESS;
        }
        .encoder_down{
            grid-area:DOWN;
        }
        .bottom .tooltip_label{
            writing-mode: vertical-rl;
        }
        .tooltip_label{
            font-size:calc(15px * var(--ui-scale));
        }
        .tooltip_key{
            font-size:calc(15px * var(--ui-scale));
            padding:0px;
            display:flex;
            width:fit-content;
            margin:auto;
            justify-content: center;
            align-items: center;
            border:solid white;
            border-width:calc(2px * var(--ui-scale));
            border-radius:calc(5px * var(--ui-scale));
            width:calc(15px * var(--ui-scale));
            height:calc(15px * var(--ui-scale));
            display:flex;
        }

    </style>
    <script src="../coi-serviceworker.min.js" type = "text/javascript"></script>
</head>
<body>
    <div id = "app_container">
        <div id = "canvas_container">
            <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
            <img id = "hardware_overlay_image" class = "hardware_overlay" src = "../assets/hardware_overlay_transparent.png">
            <div id = "button_container">
                <div id = "NEW_button" class = "hardware_button"><div class = "button_tooltip left"><div class = "tooltip_label">new</div><div id = "NEW_key" class = "tooltip_key">1</div></div></div>
                <div id = "SHIFT_button" class = "hardware_button"><div class = "button_tooltip left"><div class = "tooltip_label">shift</div><div id = "SHIFT_key"  class = "tooltip_key">Q</div></div></div>
                <div id = "SELECT_button" class = "hardware_button"><div class = "button_tooltip left"><div class = "tooltip_label">select</div><div id = "SELECT_key"  class = "tooltip_key">A</div></div></div>
                <div id = "DELETE_button" class = "hardware_button"><div class = "button_tooltip left"><div class = "tooltip_label">delete</div><div id = "DELETE_key"  class = "tooltip_key">Z</div></div></div>
                <div id = "LOOP_button" class = "hardware_button"><div class = "button_tooltip bottom"><div class = "tooltip_label">loop</div><div id = "LOOP_key"  class = "tooltip_key">X</div></div></div>
                <div id = "PLAY_button" class = "hardware_button"><div class = "button_tooltip bottom"><div class = "tooltip_label">play</div><div id = "PLAY_key"  class = "tooltip_key">C</div></div></div>
                <div id = "COPY_button" class = "hardware_button"><div class = "button_tooltip bottom"><div class = "tooltip_label">copy</div><div id = "COPY_key"  class = "tooltip_key">V</div></div></div>
                <div id = "MENU_button" class = "hardware_button"><div class = "button_tooltip bottom"><div class = "tooltip_label">menu</div><div id = "MENU_key"  class = "tooltip_key">B</div></div></div>
                <div id = "encoder_A_buttons"><div class = "encoder_button up_button" id = "A_up">+</div><div class = "encoder_button down_button" id = "A_down">-</div><div class = "button_tooltip encoder"><div id = "A_UP_key"  class = "tooltip_key encoder_up">0</div><div id = "A_PRESS_key"  class = "tooltip_key encoder_press">O</div><div class = "tooltip_label">A</div><div id = "A_DOWN_key"  class = "tooltip_key encoder_down">K</div></div></div>
                <img draggable = "false" id = "encoder_A_image" class = "hardware_button" src = "../assets/encoder.png">
                <div id = "encoder_B_buttons"><div class = "encoder_button up_button" id = "B_up">+</div><div class = "encoder_button down_button" id = "B_down">-</div><div class = "button_tooltip encoder"><div id = "B_UP_key"  class = "tooltip_key encoder_up">-</div><div id = "B_PRESS_key"  class = "tooltip_key encoder_press">P</div><div class = "tooltip_label">B</div><div id = "B_DOWN_key"  class = "tooltip_key encoder_down">L</div></div></div>
                <img draggable = "false" id = "encoder_B_image" class = "hardware_button" src = "../assets/encoder.png">
                <div id = "joystick_image" draggable = "false" class = "hardware_button" >
                    <div id = "joystick_buttons">
                        <div class = "joystick_button" id = "J_right"></div>
                        <div class = "joystick_button" id = "J_left"></div>
                        <div class = "joystick_button" id = "J_up"></div>
                        <div class = "joystick_button" id = "J_down"></div>
                    </div>
                    <img id = "joystick_image" draggable = "false" src = "../assets/joystick.png">
                    <div class = "button_tooltip joystick_keys"><div id = "UP_key"  class = "tooltip_key joystick_up">v</div><div id = "LEFT_key"  class = "tooltip_key joystick_left"><</div><div id = "DOWN_key"  class = "tooltip_key joystick_down">v</div><div id = "RIGHT_key"  class = "tooltip_key joystick_right">></div></div>
                </div>
            </div>
        </div>
        <div id = "headless_title" class = "cursive_text">Headless</div>
        <div id = "ui_container">
            <div id = "title" style = "flex-direction:row;display:flex;">
                <img draggable = "false" id = "title_image" src = "../assets/title.svg">
            </div>
            <div style = "display:flex;flex-direction: row;">
                <div class = "ui_text">UI overlay:</div>
                <input type = "checkbox" id = "ui_overlay_checkbox" checked = "true">
            </div>
            <div class = "button" id = "init_midi_button">connect MIDI</div>
            <div class = "slider_container">
                <div class = "slider_label ui_text">zoom </div>
                <input id = "zoom_slider" type = "range" min = "1" max = "8" step = "0.1" value = "3">
            </div>
        </div>
    </div>
    <div id="status">Loading...</div>
    <script>
        let rotationA = 0, rotationB = 0;
        var midiInput = null;
        var midiOutput = null;
        var Module = {
            canvas: document.getElementById('canvas'),
            setStatus: function(text) {
                document.getElementById('status').innerText = text;
            },
            print: function(text) {
                console.log(text);
            }
        };
        function initMIDI(){
            navigator.requestMIDIAccess().then(function(midiAccess) {
                for (let output of midiAccess.outputs.values()) {
                    midiOutput = output;
                    break; // grabbing the first available output, same as input
                }
                for (let input of midiAccess.inputs.values()) {
                    midiInput = input;
                    input.onmidimessage = function(event) {
                        // event.data is a Uint8Array: [status, data1, data2]
                        Module.ccall(
                            'onMidiMessage',
                            null,
                            ['number', 'number', 'number'],
                            [event.data[0], event.data[1] || 0, event.data[2] || 0]
                        );
                    };
                    break; // just grabbing the first available input for now
                }
                // document.documentElement.style.setProperty("--midi-connected", parseFloat(event.target.value));
                document.getElementById('init_midi_button').innerText = "MIDI connected";
            }).catch(function(err) {
                console.warn('Web MIDI access denied or unavailable:', err);
            });
        }
        initMIDI();
        // initialize midi button
        document.getElementById("init_midi_button").addEventListener('click',(event)=>{
            initMIDI();
        })
        // zoom slider
        document.getElementById("zoom_slider").addEventListener('input',(event)=>{
            console.log(event.target.value);
            document.documentElement.style.setProperty("--ui-scale", parseFloat(event.target.value));
        })
        // ui checkbox
        document.getElementById("ui_overlay_checkbox").addEventListener('change',(event)=>{
            document.documentElement.style.setProperty("--ui-visibility", event.target.checked?'visible':'hidden');
        })
        const preventDefaultKeys = new Set([
            'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
            ' ',        // spacebar
            'Tab'
        ]);
        let joystickCoords = {
            x:0,
            y:0
        };
        function initButtonCallbacks(){
            let encoders = document.getElementsByClassName('encoder_button');
            encoders[0].addEventListener('mousedown',(event)=>{
                Module.ccall('pressButtonFromJS', null, ['number'], [8]);
                rotationA -= 360/16;
                document.documentElement.style.setProperty("--encoder-rotation-A", `${rotationA}deg`);
            });
            encoders[0].addEventListener('touchstart',(event)=>{
                Module.ccall('pressButtonFromJS', null, ['number'], [8]);
                rotationA -= 360/16;
                document.documentElement.style.setProperty("--encoder-rotation-A", `${rotationA}deg`);
            });
            encoders[1].addEventListener('mousedown',(event)=>{
                Module.ccall('pressButtonFromJS', null, ['number'], [9]);
                rotationA += 360/16;
                document.documentElement.style.setProperty("--encoder-rotation-A", `${rotationA}deg`);
            });
            encoders[1].addEventListener('touchstart',(event)=>{
                Module.ccall('pressButtonFromJS', null, ['number'], [9]);
                rotationA += 360/16;
                document.documentElement.style.setProperty("--encoder-rotation-A", `${rotationA}deg`);
            });
            encoders[2].addEventListener('mousedown',(event)=>{
                Module.ccall('pressButtonFromJS', null, ['number'], [11]);
                rotationB -= 360/16;
                document.documentElement.style.setProperty("--encoder-rotation-B", `${rotationB}deg`);
            });
            encoders[2].addEventListener('touchstart',(event)=>{
                Module.ccall('pressButtonFromJS', null, ['number'], [11]);
                rotationB -= 360/16;
                document.documentElement.style.setProperty("--encoder-rotation-B", `${rotationB}deg`);
            });
            encoders[3].addEventListener('mousedown',(event)=>{
                Module.ccall('pressButtonFromJS', null, ['number'], [12]);
                rotationB += 360/16;
                document.documentElement.style.setProperty("--encoder-rotation-B", `${rotationB}deg`);
            });
            encoders[3].addEventListener('touchstart',(event)=>{
                Module.ccall('pressButtonFromJS', null, ['number'], [12]);
                rotationB += 360/16;
                document.documentElement.style.setProperty("--encoder-rotation-B", `${rotationB}deg`);
            });

            let joysticks = document.getElementsByClassName('joystick_button');
            for(let j = 0; j<joysticks.length; j++){
                joysticks[j].addEventListener('mousedown',(event)=>{
                    Module.ccall('pressButtonFromJS', null, ['number'], [j+14]);
                });
                joysticks[j].addEventListener('mouseup',(event)=>{
                    Module.ccall('unpressButtonFromJS', null, ['number'], [j+14]);
                });
                joysticks[j].addEventListener('touchstart',(event)=>{
                    Module.ccall('pressButtonFromJS', null, ['number'], [j+14]);
                });
                joysticks[j].addEventListener('touchend',(event)=>{
                    Module.ccall('unpressButtonFromJS', null, ['number'], [j+14]);
                });
            }
            let buttons = document.getElementsByClassName('hardware_button');
            for(let i = 0; i<8; i++){
